name: Initialize ComfyStep database
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate database connection secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret using the Render External Database URL."
            exit 1
          fi
      - name: Check PostgreSQL connectivity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node - <<'NODE'
          const { URL } = require('node:url');
          const net = require('node:net');
          const dns = require('node:dns').promises;
          async function main() {
            const raw = process.env.DATABASE_URL;
            let url;
            try { url = new URL(raw); } catch { throw new Error('DATABASE_URL is not a valid URL. Copy the full Render External Database URL.'); }
            if (!['postgres:', 'postgresql:'].includes(url.protocol)) throw new Error('DATABASE_URL must use postgres:// or postgresql://');
            if (!url.hostname) throw new Error('DATABASE_URL has no hostname');
            const host = url.hostname;
            const port = Number(url.port || 5432);
            console.log('Connection URL format: valid');
            console.log('External endpoint check:');
            let addresses;
            try { addresses = await dns.lookup(host, {all:true}); }
            catch (err) { throw new Error('DNS resolution failed ('+err.code+'). Ensure GitHub Secret uses the EXTERNAL database URL, not Internal.'); }
            console.log('DNS resolution: success');
            await new Promise((resolve,reject)=>{
              const socket = net.connect({host,port});
              socket.setTimeout(8000);
              socket.once('connect',()=>{socket.destroy();resolve();});
              socket.once('timeout',()=>{socket.destroy();reject(new Error('TCP connection timed out. Check External Database URL and database status.'));});
              socket.once('error',(err)=>reject(new Error('TCP connection failed: '+err.code)));
            });
            console.log('TCP connection: success');
          }
          main().catch(err=>{console.error('Database connectivity check failed:',err.message);process.exitCode=1;});
          NODE
      - name: Test database authentication and SQL query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node - <<'NODE'
          const { Client } = require('./lib/db/node_modules/pg');
          const raw=process.env.DATABASE_URL;
          async function test(ssl) {
            const client = new Client({connectionString:raw, ssl, connectionTimeoutMillis:8000});
            try {
              await client.connect();
              const result=await client.query('select current_database() as db, current_user as username, (select count(*) from information_schema.tables where table_schema = $1) as tables', ['public']);
              console.log('PostgreSQL authentication: success');
              console.log('SQL query: success');
              console.log('Existing public tables:', result.rows[0].tables);
              await client.end();
              return true;
            } catch(e) {
              console.log('PostgreSQL connection error code:',e.code||'unknown');
              console.log('PostgreSQL connection error:',String(e.message).replace(/postgres(?:ql)?:\\/\\/[^\\s]+/g,'[database-url-redacted]'));
              try { await client.end(); } catch {}
              return false;
            }
          }
          (async()=>{
            if(await test(undefined)) return;
            console.log('Retrying with SSL enabled...');
            if(await test({rejectUnauthorized:false})) return;
            process.exitCode=1;
          })();
          NODE
      - name: Create database tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @workspace/db push
